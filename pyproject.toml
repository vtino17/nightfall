[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nightfall"
version = "1.0.0"
description = "Modular vulnerability scanning framework with plugin architecture"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["security", "vulnerability", "scanner", "cve"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]

[project.scripts]
nightfall = "nightfall.cli:entry_point"

[tool.setuptools.packages.find]
include = ["nightfall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
